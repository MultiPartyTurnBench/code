[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mptb"
version = "1.0.0"
description = "MultiPartyTurnBench: evaluation, baselines, data generation and paper reproduction code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []   # the scorer (mptb.eval, mptb.data, scripts/evaluate.py) uses only the standard library

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.setuptools.packages.find]
include = ["mptb*"]

[tool.setuptools.package-data]
"mptb.generation" = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
